spring.application.name=illuminate-qr-system
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/illuminate_qr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initial SQL Schema Execution
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:IlluminateIITBombayKMCT2026SuperSecretSecureKey9876543210}
app.jwt.expiration-ms=86400000

# Event Domain for QR Verification URLs
app.domain=${APP_DOMAIN:http://localhost:5173}

# File Upload Limit for CSV Import
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
